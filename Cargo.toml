[package]
name = "kesp-controller"
version = "3.0.0-beta.2"
edition = "2021"
license = "GPL-3.0"
description = "Configurateur egui pour le clavier split KeSp"

# The release pipeline and the flake ship a binary with this name.
[[bin]]
name = "KeSp_controller"
path = "src/main.rs"

[dependencies]
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = "4"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL: WebGPU is missing from too many browsers.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "HtmlCanvasElement", "Element", "console"] }

[dev-dependencies]
egui_kittest = "0.37"

[profile.release]
opt-level = "s"
lto = true
strip = true
