stages:
  - build
  - upload
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kesp-controller/${CI_COMMIT_TAG}"

# ==================== LINUX BUILD ====================
build:linux:
  stage: build
  image: rust:1-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  before_script:
    - apt-get update
    - apt-get install -y libudev-dev libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev
  script:
    - cargo build --release --target x86_64-unknown-linux-gnu
    - cp target/x86_64-unknown-linux-gnu/release/KeSp_controller KeSp_controller-linux-x86_64
  artifacts:
    paths:
      - KeSp_controller-linux-x86_64
    expire_in: 1 week
  cache:
    key: linux
    paths:
      - .cargo/
      - target/

# ==================== WINDOWS BUILD (cross from Linux) ====================
build:windows:
  stage: build
  image: rust:1-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  before_script:
    - apt-get update
    - apt-get install -y mingw-w64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --target x86_64-pc-windows-gnu
    - cp target/x86_64-pc-windows-gnu/release/KeSp_controller.exe KeSp_controller-windows-x86_64.exe
  artifacts:
    paths:
      - KeSp_controller-windows-x86_64.exe
    expire_in: 1 week
  cache:
    key: windows
    paths:
      - .cargo/
      - target/

# ==================== UPLOAD TO PACKAGE REGISTRY ====================
upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file KeSp_controller-linux-x86_64 \
           "${PACKAGE_REGISTRY_URL}/KeSp_controller-linux-x86_64"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file KeSp_controller-windows-x86_64.exe \
           "${PACKAGE_REGISTRY_URL}/KeSp_controller-windows-x86_64.exe"

# ==================== RELEASE ====================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  needs:
    - upload
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'KeSp Controller $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG — see commit log for changes.'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'KeSp_controller-linux-x86_64'
          url: '${PACKAGE_REGISTRY_URL}/KeSp_controller-linux-x86_64'
          link_type: 'package'
        - name: 'KeSp_controller-windows-x86_64.exe'
          url: '${PACKAGE_REGISTRY_URL}/KeSp_controller-windows-x86_64.exe'
          link_type: 'package'
